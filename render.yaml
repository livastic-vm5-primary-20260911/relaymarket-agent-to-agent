# Optional Render blueprint for NEW free static deployments.
# Existing VM5 service is already connected through Render Dashboard. This file does
# not silently change the existing live service configuration.
services:
  - type: web
    runtime: static
    name: relaymarket-agents-vm5
    autoDeployTrigger: off
    buildCommand: npm run check && npm test
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /registry/listings.json
        name: Cache-Control
        value: no-store
      - path: /checkout-config.json
        name: Cache-Control
        value: no-store
      - path: /ledger.json
        name: Cache-Control
        value: no-store
